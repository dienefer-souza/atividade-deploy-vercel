<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 40px;
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
      }

      #dados {
        max-width: 700px;
        margin: 0 auto;
      }

      .pessoa {
        background-color: white;
        padding: 18px 22px;
        margin-bottom: 15px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      .pessoa strong {
        color: #333;
      }

      .turma {
        color: #666;
        margin-top: 6px;
      }

      .voltar {
        display: block;
        width: fit-content;
        margin: 25px auto 0;
        color: white;
        background-color: #007bff;
        padding: 10px 18px;
        border-radius: 6px;
        text-decoration: none;
      }

      .voltar:hover {
        background-color: #0056b3;
      }
    </style>
  </head>

  <body>
    <h1>PESSOAS CADASTRADAS</h1>
    <div id="dados"></div>
    <a class="voltar" href="index.html">← Voltar para a página inicial</a>
  </body>
  <script>
    async function puxaDados() {
      let url = "/pessoas";
      let respReq = await fetch(url);
      let dadosJson = await respReq.json();
      console.log(dadosJson);
      let divDados = document.querySelector("#dados");
      for (let i = 0; i < dadosJson.length; i++) {
        divDados.innerHTML += `
    <div class="pessoa">
      <strong>Nome:</strong> ${dadosJson[i].nome}
      <div class="turma">
        <strong>Turma:</strong> ${dadosJson[i].turma}
      </div>
    </div>
  `;
      }
    }
    puxaDados();
  </script>
</html>
